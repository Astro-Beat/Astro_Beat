<!DOCTYPE html>
<html lang="es">
<head>

<link rel="stylesheet" href="css/01-tokens.css">
<link rel="stylesheet" href="css/02-watch.css">
<link rel="stylesheet" href="css/03-screens.css">
<link rel="stylesheet" href="css/04-drawer.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/></symbol>
<symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.500s6 6.200 6 10.500a6 6 0 0 1-12 0c0-4.300 6-10.500 6-10.500z"/></symbol>
<symbol id="i-thermo" viewBox="0 0 24 24"><path d="M10 14.500V5a2 2 0 0 1 4 0v9.500a4 4 0 1 1-4 0z"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 6 13.500h5L10 21l7-10.500h-5z"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></symbol>
<symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
<symbol id="i-fork" viewBox="0 0 24 24"><path d="M7 3v6a2 2 0 0 0 4 0V3M9 11v10M17 3v18M17 3c-2 1.500-3 4-3 7h3"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1zM6 6h12v14H6zM9 11h6M9 15h4"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20v-6M10 20V6M16 20v-9M21 20H3"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.500 20h19zM12 10v4M12 17.500v.01"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8v.01"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></symbol>
<symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3zM20 19a4 4 0 0 1-4 3h-3"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7"/></symbol>
<symbol id="i-antenna" viewBox="0 0 24 24"><path d="M5 12a7 7 0 0 1 14 0M8.500 12a3.500 3.500 0 0 1 7 0M12 12v9M9 21h6"/></symbol>
<symbol id="i-logo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.500" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="10.500" ry="3.800" transform="rotate(-20 12 12)"/></symbol>
</defs></svg>

<div id="stage">
  <button class="nav" id="prev" aria-label="Pantalla anterior">‹</button>
  <div id="watch">
    <div class="strap top"></div>
    <div class="case">
      <i class="crown" id="crown" title="Rueda: cambiar pantalla · clic: Inicio"></i>
      <i class="sbtn" id="sbtn" title="Menú"></i>
      <div class="glass" id="glass">
        <div class="track" id="track"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="strap bot"></div>
  </div>
  <button class="nav" id="next" aria-label="Pantalla siguiente">›</button>
</div>

<button id="menu" aria-label="Abrir panel de control" aria-expanded="false">☰</button>
<aside id="drawer" aria-label="Panel de simulación"></aside>
<div id="toast" role="status"></div>

<script defer src="js/01-config.js"></script>
<script defer src="js/02-util.js"></script>
<script defer src="js/03-port.js"></script>
<script defer src="js/04-adapters.js"></script>
<script defer src="js/05-core.js"></script>
<script defer src="js/06-state.js"></script>
<script defer src="js/07-screens.js"></script>
<script defer src="js/08-ui.js"></script>
<script defer src="js/09-drawer.js"></script>
<script defer src="js/10-loop.js"></script>
<script defer src="js/11-selftest.js"></script>
<script defer src="js/12-main.js"></script>
</body>
</html>
